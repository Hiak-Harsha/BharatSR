# BharatSR (SIH26142) — Single-Node Production Deployment
# Architecture: Single-node FastAPI + SQLite persistent JobStore + ThreadPoolExecutor
# Eliminates external queue bloat (Redis) while guaranteeing ACID job durability.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bharatsr-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - BHARATSR_MAX_WORKERS=4
      - BHARATSR_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    volumes:
      - ./backend/weights:/app/backend/weights:ro
      - ./backend/sample_tiles:/app/backend/sample_tiles:ro
      - ./backend/runs:/app/backend/runs
      - ./backend/bharatsr.db:/app/backend/bharatsr.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bharatsr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy

