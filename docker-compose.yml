services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bharatsr-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - WORKERS=4
    volumes:
      - ./backend/weights:/app/backend/weights:ro
      - ./backend/sample_tiles:/app/backend/sample_tiles:ro
      - ./backend/runs:/app/backend/runs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bharatsr-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: bharatsr-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  redis_data:
