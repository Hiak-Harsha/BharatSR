name: Keep Backend Warm
on:
  schedule:
    - cron: "*/10 * * * *"   # Every 10 minutes — safely under Render free tier's ~15 min idle window
  workflow_dispatch: {}       # Allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          curl -sf --max-time 60 "${{ secrets.BHARATSR_BACKEND_HEALTH_URL }}" \
            || curl -sf --max-time 90 "${{ secrets.BHARATSR_BACKEND_HEALTH_URL }}"
