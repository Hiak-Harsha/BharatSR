# BharatSR Configuration (SIH26142)
# Scientifically Defensible 4x Super-Resolution for Sentinel-2 MSI

project:
  name: "BharatSR"
  problem_statement: "SIH26142"
  domain: "Remote Sensing Space Technology"
  target_sensor: "Sentinel-2 MSI (Level-2A BOA Surface Reflectance)"
  input_gsd_m: 10.0
  output_gsd_m: 2.5
  scale_factor: 4
  bands:
    - name: "B2"
      wavelength_nm: 490
      description: "Blue"
      idx: 0
    - name: "B3"
      wavelength_nm: 560
      description: "Green"
      idx: 1
    - name: "B4"
      wavelength_nm: 665
      description: "Red"
      idx: 2
    - name: "B8"
      wavelength_nm: 842
      description: "Near-Infrared (NIR)"
      idx: 3

reproducibility:
  seed: 42
  deterministic_cuda: false

models:
  srcnn:
    id: "srcnn"
    name: "SRCNN Baseline"
    n_bands: 4
    scale_factor: 4
    num_params: 57604
    description: "3-layer convolutional baseline with bicubic pre-upsampling"

  rcan:
    id: "rcan"
    name: "Residual Channel Attention Network (RCAN-Lite)"
    n_bands: 4
    n_feats: 36
    n_resgroups: 3
    n_resblocks: 3
    reduction: 16
    scale_factor: 4
    predict_uncertainty: true
    num_params: 356816
    description: "Lightweight RCAN-inspired architecture with Channel Attention, residual learning anchor, and heteroscedastic uncertainty head"

  swinir:
    id: "swinir"
    name: "SwinIR Super-Resolution (Swin Transformer)"
    n_bands: 4
    embed_dim: 60
    depths: [6, 6, 6]
    num_heads: [6, 6, 6]
    window_size: 4
    scale_factor: 4
    predict_uncertainty: true
    num_params: 820000
    description: "Shifted-window attention Transformer with heteroscedastic uncertainty head"

  hat:
    id: "hat"
    name: "HAT Super-Resolution (Hybrid Attention Transformer)"
    n_bands: 4
    embed_dim: 48
    depths: [4, 4, 4]
    num_heads: [4, 4, 4]
    window_size: 4
    scale_factor: 4
    predict_uncertainty: true
    num_params: 650000
    description: "Hybrid window + channel attention Transformer"

  diffusion:
    id: "diffusion"
    name: "DiffusionSR (4-Step DDIM Conditional)"
    n_bands: 4
    scale_factor: 4
    num_diffusion_steps: 4
    num_params: 900000
    description: "Lightweight conditional DDPM with 4-step DDIM inference"

  ensemble:
    id: "ensemble"
    name: "EnsembleSR (RCAN + SwinIR Weighted Average)"
    component_models: ["rcan", "swinir"]
    weights: [0.6, 0.4]
    description: "Inference-time weighted ensemble"

training:
  batch_size: 4
  epochs: 10
  lr: 0.0005
  min_lr: 0.00001
  weight_decay: 0.00001
  clip_grad_norm: 1.0

  # Multi-Task Physics Loss Weights:
  # L_total = lambda_rec * L1 + lambda_sam * L_SAM + lambda_dc * L_DC + lambda_unc * L_uncertainty
  loss_weights:
    lambda_rec: 1.0
    lambda_sam: 0.1
    lambda_dc: 0.1
    lambda_unc: 0.2

tiling:
  tile_size: 128
  overlap: 32
  blend_mode: "hann"  # 2D Hann window blending
  batch_size: 1

evaluation:
  degradation_operator: "4x4 area average aligned with LR grid"
  lpips: true
  ece: true
  fid: false
  metrics:
    - "psnr_db"
    - "ssim"
    - "sam_degrees"
    - "downsample_consistency_mae"
    - "spectral_mae"
    - "hallucination_rate"
    - "omission_rate"
    - "correctness_score"
  uncertainty_calibration:
    confidence_levels: [0.68, 0.95]
    high_error_quantile: 0.85

farmer_features:
  spectral_indices: ["ndvi", "ndwi", "evi", "savi", "rvi", "ndbi_approx", "gci"]
  crop_health_classes: ["Dense Healthy Crop", "Moderate Vegetation", "Sparse/Stressed", "Bare Soil", "Water", "Built-up"]
  ndvi_thresholds:
    dense_healthy: 0.6
    moderate: 0.3
    sparse: 0.1
  change_detection_methods: ["ndvi_diff", "spectral_diff", "cvaps"]
